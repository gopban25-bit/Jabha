<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobile App Auth</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: fixed;
            touch-action: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #030303;
        }

        /* الخلفية الدخانية المتحركة بالأحمر والأصفر */
        .smoke-background {
            position: absolute;
            inset: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(circle at 30% 40%, rgba(255, 193, 7, 0.35) 0%, transparent 55%),
                radial-gradient(circle at 70% 60%, rgba(255, 23, 68, 0.35) 0%, transparent 55%),
                radial-gradient(circle at 50% 25%, rgba(255, 143, 0, 0.25) 0%, transparent 45%),
                radial-gradient(circle at 65% 75%, rgba(213, 0, 0, 0.3) 0%, transparent 50%);
            filter: blur(90px);
            z-index: -1;
            animation: fluidSmoke 18s ease-in-out infinite alternate;
        }

        @keyframes fluidSmoke {
            0% { transform: translate(-3%, -3%) scale(1) rotate(0deg); }
            50% { transform: translate(4%, 4%) scale(1.12) rotate(8deg); }
            100% { transform: translate(-2%, 3%) scale(1.05) rotate(-6deg); }
        }

        .phone-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            box-sizing: border-box;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 2px solid rgba(255, 255, 255, 0.9);
            border-radius: 32px;
            padding: 35px 25px;
            width: 100%;
            max-width: 350px;
            box-sizing: border-box;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7),
                        inset 0 0 20px rgba(255, 255, 255, 0.2),
                        0 0 35px rgba(255, 255, 255, 0.3);
            color: #ffffff;
            text-align: left;
            overflow: hidden;
            position: relative;
        }

        .login-card h2 {
            margin: 0 0 5px 0;
            font-size: 34px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.4);
        }

        .login-card p {
            margin: 0 0 25px 0;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.7);
        }

        .input-group {
            position: relative;
            margin-bottom: 18px;
            width: 100%;
        }

        .input-group input {
            width: 100%;
            padding: 14px 45px 14px 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid #ffd700;
            border-radius: 14px;
            color: #fff;
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.3), inset 0 0 6px rgba(255, 215, 0, 0.15);
            transition: all 0.3s ease;
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .input-group input:focus {
            border-color: #ffea75;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.7), inset 0 0 10px rgba(255, 215, 0, 0.3);
        }

        .input-group svg {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            fill: #ffd700;
            filter: drop-shadow(0 0 6px rgba(255, 215, 0, 0.8));
            animation: goldPulse 2s ease-in-out infinite alternate;
        }

        @keyframes goldPulse {
            0% { filter: drop-shadow(0 0 4px rgba(255, 215, 0, 0.6)); }
            100% { filter: drop-shadow(0 0 10px rgba(255, 215, 0, 1)); }
        }

        .actions-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 10px;
        }

        /* الإطار المتحرك لزر تسجيل الدخول */
        .btn-wrapper {
            position: relative;
            width: 100%;
            border-radius: 16px;
            padding: 2px;
            background: linear-gradient(90deg, #ff1744, #ffd700, #ff9100, #ff1744);
            background-size: 300% 300%;
            animation: moveBorder 4s linear infinite;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
        }

        @keyframes moveBorder {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, rgba(255, 193, 7, 0.9) 0%, rgba(213, 0, 0, 0.9) 100%);
            border: none;
            border-radius: 14px;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-sizing: border-box;
            transition: all 0.3s ease;
            text-align: center;
        }

        /* زر إنشاء حساب جديد */
        .signup-btn {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 215, 0, 0.5);
            border-radius: 14px;
            color: #ffd700;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            box-sizing: border-box;
            transition: all 0.3s ease;
            text-align: center;
        }

        .signup-btn:hover {
            background: rgba(255, 215, 0, 0.15);
            border-color: #ffd700;
        }

        .message-box {
            margin-top: 15px;
            font-size: 13px;
            text-align: center;
            display: none;
            padding: 10px;
            border-radius: 10px;
            word-break: break-word;
        }
        .message-box.error {
            background: rgba(255, 23, 68, 0.2);
            border: 1px solid rgba(255, 23, 68, 0.6);
            color: #ff8a80;
        }
        .message-box.success {
            background: rgba(0, 230, 118, 0.2);
            border: 1px solid rgba(0, 230, 118, 0.6);
            color: #b9f6ca;
        }
    </style>
</head>
<body>

    <div class="smoke-background"></div>

    <div class="phone-container">
        <div class="login-card">
            <h2>𝐋𝐨𝐠𝐢𝐧</h2>
            <p>Welcome back</p>
            
            <form id="authForm">
                <div class="input-group">
                    <input type="email" id="email" placeholder="Email Address" required>
                    <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
                </div>
                
                <div class="input-group">
                    <input type="password" id="password" placeholder="Password" required>
                    <svg viewBox="0 0 24 24"><path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2z"/></svg>
                </div>
                
                <div class="actions-group">
                    <div class="btn-wrapper">
                        <button type="button" id="loginBtn" class="login-btn">Login</button>
                    </div>
                    <button type="button" id="signupBtn" class="signup-btn">Create New Account</button>
                </div>
            </form>

            <div id="messageBox" class="message-box"></div>
        </div>
    </div>

    <!-- Firebase JS SDK (v10 Modular) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyARPqKI8r2GYPn1xKy3M7m7ZE3d5Wgq7uY",
            authDomain: "whatsapp-41877.firebaseapp.com",
            projectId: "whatsapp-41877",
            storageBucket: "whatsapp-41877.firebasestorage.app",
            messagingSenderId: "581714425078",
            appId: "1:581714425078:web:a9ae487cc38f18d865e8d7",
            measurementId: "G-SET3RQG2G8"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const signupBtn = document.getElementById('signupBtn');
        const messageBox = document.getElementById('messageBox');

        // تسجيل الدخول لحساب موجود
        loginBtn.addEventListener('click', async () => {
            const email = emailInput.value.trim();
            const password = passwordInput.value;

            if (!email || !password) {
                showMessage("Please fill in all fields.", "error");
                return;
            }

            setLoading(true, "Logging in...");

            try {
                await signInWithEmailAndPassword(auth, email, password);
                showMessage("Login successful! Welcome back.", "success");
            } catch (error) {
                handleAuthError(error);
            } finally {
                setLoading(false, "Login");
            }
        });

        // إنشاء حساب جديد وتسجيل الدخول فوراً
        signupBtn.addEventListener('click', async () => {
            const email = emailInput.value.trim();
            const password = passwordInput.value;

            if (!email || !password) {
                showMessage("Please enter email and password.", "error");
                return;
            }

            if (password.length < 6) {
                showMessage("Password must be at least 6 characters.", "error");
                return;
            }

            setLoading(true, "Creating Account...");

            try {
                await createUserWithEmailAndPassword(auth, email, password);
                showMessage("Account created & logged in successfully!", "success");
            } catch (error) {
                handleAuthError(error);
            } finally {
                setLoading(false, "Login");
            }
        });

        function setLoading(isLoading, text) {
            loginBtn.textContent = text;
            loginBtn.disabled = isLoading;
            signupBtn.disabled = isLoading;
            if (isLoading) messageBox.style.display = 'none';
        }

        function handleAuthError(error) {
            let errorText = "Authentication failed.";
            if (error.code === 'auth/email-already-in-use') {
                errorText = "This email is already registered. Click Login.";
            } else if (error.code === 'auth/invalid-credential' || error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found') {
                errorText = "Incorrect Email or Password.";
            } else if (error.code === 'auth/invalid-email') {
                errorText = "Please enter a valid email address.";
            } else if (error.code === 'auth/weak-password') {
                errorText = "Password should be at least 6 characters.";
            }
            showMessage(errorText, 'error');
        }

        function showMessage(msg, type) {
            messageBox.textContent = msg;
            messageBox.className = `message-box ${type}`;
            messageBox.style.display = 'block';
        }
    </script>

</body>
</html>
