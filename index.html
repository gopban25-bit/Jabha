<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mochat</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: fixed;
            touch-action: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #030303;
        }

        .smoke-background {
            position: absolute;
            inset: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(circle at 30% 40%, rgba(255, 193, 7, 0.35) 0%, transparent 55%),
                radial-gradient(circle at 70% 60%, rgba(255, 23, 68, 0.35) 0%, transparent 55%),
                radial-gradient(circle at 50% 25%, rgba(255, 143, 0, 0.25) 0%, transparent 45%),
                radial-gradient(circle at 65% 75%, rgba(213, 0, 0, 0.3) 0%, transparent 50%);
            filter: blur(90px);
            z-index: -1;
            animation: fluidSmoke 18s ease-in-out infinite alternate;
        }

        @keyframes fluidSmoke {
            0% { transform: translate(-3%, -3%) scale(1) rotate(0deg); }
            50% { transform: translate(4%, 4%) scale(1.12) rotate(8deg); }
            100% { transform: translate(-2%, 3%) scale(1.05) rotate(-6deg); }
        }

        .phone-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            box-sizing: border-box;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 2px solid rgba(255, 255, 255, 0.9);
            border-radius: 32px;
            padding: 25px 20px 15px 20px;
            width: 100%;
            max-width: 350px;
            height: 85vh;
            box-sizing: border-box;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7),
                        inset 0 0 20px rgba(255, 255, 255, 0.2),
                        0 0 35px rgba(255, 255, 255, 0.3);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .login-card h2 {
            margin: 0 0 5px 0;
            font-size: 26px;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.4);
        }

        .login-card p {
            margin: 0 0 20px 0;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.7);
        }

        .step {
            display: none;
            flex: 1;
            flex-direction: column;
            overflow-y: auto;
        }
        .step.active {
            display: flex;
        }

        .input-group {
            position: relative;
            margin-bottom: 18px;
            width: 100%;
        }

        .input-group input {
            width: 100%;
            padding: 14px 45px 14px 14px;

            border: 2px solid #ffd700;
            border-radius: 14px;

            box-sizing: border-box;

        .input-group svg {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            fill: #ffd700;
        }

        .actions-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 10px;
        }

        .btn-wrapper {
            position: relative;
            width: 100%;
            border-radius: 16px;
            padding: 2px;
            background: linear-gradient(90deg, #ff1744, #ffd700, #ff9100, #ff1744);
            background-size: 300% 300%;
            animation: moveBorder 4s linear infinite;
        }

        @keyframes moveBorder {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, rgba(255, 193, 7, 0.9) 0%, rgba(213, 0, 0, 0.9) 100%);

        .chat-item:hover {

        }
        .chat-item-name {
            font-size: 14px;
            font-weight: bold;
            color: #ffffff;

        }
        .chat-item-lastmsg {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;

        .unread-badge {

            font-weight: bold;

            display: flex;
            flex-direction: column;

            justify-content: center;

        .tab-content.active {

        .tab-pane-placeholder {

    <!-- Agora Web RTC SDK -->
    <script src="https://download.agora.io/sdk/release/AgoraRTC_N-4.19.0.js"></script>

<body>
    <div class="smoke-background"></div>
    <div class="phone-container">
        <div class="login-card">
            <!-- App UI Steps go here -->
            <div id="app-container" class="main-app-container">
                <div class="app-header">
                    <h1 class="app-title">Mochat</h1>
                </div>
            </div>
        </div>
    </div>

    <!-- Agora RTC Initialization with updated App ID -->
    <script type="module">
        const AGORA_APP_ID = "ac39c29706674beeb20a6bd9a9e48000";

        let agoraClient = null;
        let localAudioTrack = null;

        async function joinAgoraChannel(channelName) {
            if (!agoraClient) {
                agoraClient = AgoraRTC.createClient({ mode: "rtc", codec: "vp8" });
            }

            agoraClient.on("user-published", async (user, mediaType) => {
                await agoraClient.subscribe(user, mediaType);
                if (mediaType === "audio") {
                    const remoteAudioTrack = user.audioTrack;
                    remoteAudioTrack.play();
                }
            });

            try {
                // Testing mode / App ID only authentication
                await agoraClient.join(AGORA_APP_ID, channelName, null, null);
                localAudioTrack = await AgoraRTC.createMicrophoneAudioTrack();
                await agoraClient.publish([localAudioTrack]);
                console.log("Successfully joined Agora voice channel:", channelName);
            } catch (error) {
                console.error("Failed to join Agora channel:", error);
            }
        }

        async function leaveAgoraChannel() {
            if (localAudioTrack) {
                localAudioTrack.stop();
                localAudioTrack.close();
                localAudioTrack = null;
            }
            if (agoraClient) {
                await agoraClient.leave();
                console.log("Left Agora channel");
            }
        }
    </script>
