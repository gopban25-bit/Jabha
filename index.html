<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobile App Login</title>
    <style>
        /* قفل الصفحة بالكامل لمنع أي تحريك أو سحب (Scroll/Bounce) */
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: fixed;
            touch-action: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #030303;
        }

        /* الخلفية الدخانية المتحركة بانسيابية بالأحمر والأصفر */
        .smoke-background {
            position: absolute;
            inset: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(circle at 30% 40%, rgba(255, 193, 7, 0.35) 0%, transparent 55%),
                radial-gradient(circle at 70% 60%, rgba(255, 23, 68, 0.35) 0%, transparent 55%),
                radial-gradient(circle at 50% 25%, rgba(255, 143, 0, 0.25) 0%, transparent 45%),
                radial-gradient(circle at 65% 75%, rgba(213, 0, 0, 0.3) 0%, transparent 50%);
            filter: blur(90px);
            z-index: -1;
            animation: fluidSmoke 18s ease-in-out infinite alternate;
        }

        @keyframes fluidSmoke {
            0% {
                transform: translate(-3%, -3%) scale(1) rotate(0deg);
            }
            50% {
                transform: translate(4%, 4%) scale(1.12) rotate(8deg);
            }
            100% {
                transform: translate(-2%, 3%) scale(1.05) rotate(-6deg);
            }
        }

        .phone-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 2px solid rgba(255, 255, 255, 0.9);
            border-radius: 32px;
            padding: 40px 25px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7),
                        inset 0 0 20px rgba(255, 255, 255, 0.2),
                        0 0 35px rgba(255, 255, 255, 0.3);
            color: #ffffff;
            text-align: left;
        }

        .login-card h2 {
            margin: 0 0 8px 0;
            font-size: 36px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.4);
        }

        .login-card p {
            margin: 0 0 30px 0;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        /* إطار الخانة ذهبي مضيء وبشكل مستقل */
        .input-group input {
            width: 100%;
            padding: 15px 45px 15px 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid #ffd700;
            border-radius: 16px;
            color: #fff;
            font-size: 15px;
            outline: none;
            box-shadow: 0 0 12px rgba(255, 215, 0, 0.4), inset 0 0 8px rgba(255, 215, 0, 0.2);
            transition: all 0.3s ease;
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .input-group input:focus {
            border-color: #ffea75;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.8), inset 0 0 12px rgba(255, 215, 0, 0.4);
        }

        /* الأيقونات الذهبية المضئة */
        .input-group svg {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 22px;
            height: 22px;
            fill: #ffd700;
            filter: drop-shadow(0 0 8px rgba(255, 215, 0, 0.8)) drop-shadow(0 0 15px rgba(255, 193, 7, 0.6));
            animation: goldPulse 2s ease-in-out infinite alternate;
        }

        @keyframes goldPulse {
            0% {
                filter: drop-shadow(0 0 5px rgba(255, 215, 0, 0.6));
            }
            100% {
                filter: drop-shadow(0 0 12px rgba(255, 215, 0, 1)) drop-shadow(0 0 20px rgba(255, 193, 7, 0.8));
            }
        }

        .login-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #ffc107 0%, #d50000 100%);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 16px;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            box-shadow: 0 5px 20px rgba(255, 193, 7, 0.3);
            margin-top: 10px;
        }

        .login-btn:hover {
            opacity: 0.95;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 23, 68, 0.4);
        }
    </style>
</head>
<body>

    <!-- الخلفية الدخانية المتحركة بالأحمر والأصفر -->
    <div class="smoke-background"></div>

    <div class="phone-container">
        <div class="login-card">
            <h2>𝐋𝐨𝐠𝐢𝐧</h2>
            <p>Welcome back</p>
            
            <form onsubmit="event.preventDefault();">
                <div class="input-group">
                    <input type="email" placeholder="Email Address" required>
                    <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
                </div>
                
                <div class="input-group">
                    <input type="password" placeholder="Password" required>
                    <svg viewBox="0 0 24 24"><path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2z"/></svg>
                </div>
                
                <button type="submit" class="login-btn">Login</button>
            </form>
        </div>
    </div>

</body>
</html>
