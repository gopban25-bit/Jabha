<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تطبيق الذكاء الاصطناعي - جواب بسطر</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white flex flex-col justify-between h-screen p-4">
  
  <div class="max-w-xl mx-auto w-full flex-1 flex flex-col">
    <h1 class="text-2xl font-bold text-center my-4 text-emerald-400">أسأل الذكاء الاصطناعي (جواب بسطر)</h1>
    
    <!-- منطقة المحادثة -->
    <div id="chat-box" class="flex-1 bg-gray-800 rounded-lg p-4 overflow-y-auto space-y-3 mb-4 border border-gray-700">
      <div class="bg-gray-700 p-3 rounded-lg max-w-xs self-start">مرحباً! سولني أي سؤال وغانجاوبك بسطر واحد فقط.</div>
    </div>

    <!-- منطقة الإدخال -->
    <div class="flex gap-2">
      <input type="text" id="user-input" placeholder="اكتب سؤالك هنا..." class="flex-1 p-3 rounded-lg bg-gray-800 border border-gray-700 text-white focus:outline-none focus:border-emerald-500">
      <button onclick="sendMessage()" class="bg-emerald-600 hover:bg-emerald-700 px-6 py-3 rounded-lg font-bold">إرسال</button>
    </div>
  </div>

  <script>
    const API_KEY = "AQ.Ab8RN6IWqQ9CpIA-hb4jDMhajTZwN_Wf-gcl_-kWNfQ288_Gjw";

    async function sendMessage() {
      const inputField = document.getElementById("user-input");
      const chatBox = document.getElementById("chat-box");
      const question = inputField.value.trim();

      if (!question) return;

      chatBox.innerHTML += `<div class="bg-emerald-800 p-3 rounded-lg max-w-xs text-left self-end mr-auto">${question}</div>`;
      inputField.value = "";
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{
              parts: [{ text: `أنت مساعد ذكي. أجب عن السؤال التالي في سطر واحد فقط لا غير ويكون مباشر وبالمغربية إن أمكن: ${question}` }]
            }]
          })
        });

        const data = await response.json();
        const answer = data.candidates?.[0]?.content?.parts?.[0]?.text || "وقع خطأ، تأكد من الاتصال.";

        chatBox.innerHTML += `<div class="bg-gray-700 p-3 rounded-lg max-w-xs text-right self-start">${answer}</div>`;
      } catch (error) {
        chatBox.innerHTML += `<div class="bg-red-900 p-3 rounded-lg max-w-xs text-right self-start">مشكل فالتطابق مع الـ API</div>`;
      }

      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>
</body>
</html>
