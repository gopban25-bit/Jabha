<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق المكالمات</title>
    <style>
        body { background-color: #121212; color: #ffffff; font-family: Tahoma, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: #1e1e1e; padding: 25px; border-radius: 12px; width: 320px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); text-align: center; }
        input { width: 100%; padding: 12px; margin: 15px 0; background: #2c2c2c; border: 1px solid #444; color: #fff; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 12px; background: #007AFF; border: none; color: white; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .hidden { display: none; }
        h2 { margin-bottom: 20px; }
    </style>
</head>
<body>

    <div class="box" id="loginBox">
        <h2>تسجيل الدخول</h2>
        <input type="text" id="userId" placeholder="أدخل الـ ID الخاص بك">
        <button onclick="login()">دخول</button>
    </div>

    <div class="box hidden" id="appBox">
        <h2 id="welcomeText">مرحباً بك</h2>
        <p>تم تسجيل الدخول بنجاح!</p>
        <button onclick="logout()" style="background: #ff3b30;">خروج</button>
    </div>

    <script>
        function login() {
            const id = document.getElementById('userId').value.trim();
            if (id !== "") {
                document.getElementById('welcomeText').innerText = "مرحباً، ID: " + id;
                document.getElementById('loginBox').classList.add('hidden');
                document.getElementById('appBox').classList.remove('hidden');
            } else {
                alert('المرجو إدخال الـ ID أولاً!');
            }
        }

        function logout() {
            document.getElementById('userId').value = "";
            document.getElementById('appBox').classList.add('hidden');
            document.getElementById('loginBox').classList.remove('hidden');
        }
    </script>

</body>
</html>
