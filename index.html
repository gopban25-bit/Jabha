<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Glass Spatial Login</title>
    <style>
        :root {
            --quantum-primary: #00ffcc;
            --quantum-secondary: #7928ca;
            --quantum-accent: #ff007f;
            --glass-surface: rgba(15, 23, 42, 0.65);
            --glass-border: rgba(255, 255, 255, 0.12);
            --text-main: #f8fafc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #030712;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Generative Shader & Volumetric Aurora Background */
        .aurora-bg {
            position: absolute;
            inset: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 30%, #7928ca33, transparent 40%),
                        radial-gradient(circle at 70% 70%, #00ffcc22, transparent 40%),
                        radial-gradient(circle at 50% 50%, #ff007f22, transparent 50%);
            animation: warpTunnel 20s linear infinite;
            z-index: -2;
            filter: blur(80px);
        }

        @keyframes warpTunnel {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.1); }
            100% { transform: rotate(360deg) scale(1); }
        }

        /* Particle Field Simulation Simulation Layer */
        .particle-field {
            position: absolute;
            inset: 0;
            background-image: radial-gradient(#fff 1px, transparent 1px);
            background-size: 40px 40px;
            opacity: 0.15;
            z-index: -1;
            animation: particleDrift 15s linear infinite;
        }

        @keyframes particleDrift {
            0% { transform: translateY(0); }
            100% { transform: translateY(-40px); }
        }

        /* Spatial Quantum Glass Portal */
        .quantum-portal {
            background: var(--glass-surface);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 45px 35px;
            width: 380px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6),
                        inset 0 1px 0 rgba(255, 255, 255, 0.2),
                        0 0 40px rgba(0, 255, 204, 0.1);
            color: var(--text-main);
            position: relative;
            transform-style: preserve-3d;
            animation: cardFloat 6s ease-in-out infinite;
        }

        @keyframes cardFloat {
            0%, 100% { transform: translateY(0) rotateX(0) rotateY(0); }
            50% { transform: translateY(-8px) rotateX(2deg) rotateY(-2deg); }
        }

        .quantum-portal::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 30px;
            background: linear-gradient(135deg, var(--quantum-primary), transparent, var(--quantum-secondary));
            z-index: -1;
            opacity: 0.5;
            filter: blur(4px);
        }

        .header-title {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
            background: linear-gradient(to right, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-subtitle {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 30px;
        }

        .input-container {
            position: relative;
            margin-bottom: 22px;
        }

        .input-container input {
            width: 100%;
            padding: 15px 18px;
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .input-container input::placeholder {
            color: rgba(148, 163, 184, 0.6);
        }

        .input-container input:focus {
            border-color: var(--quantum-primary);
            background: rgba(15, 23, 42, 0.7);
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.25);
        }

        .security-badge {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 25px;
        }

        .security-badge label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .security-badge input {
            accent-color: var(--quantum-primary);
        }

        .quantum-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--quantum-primary), #00b4d8);
            border: none;
            border-radius: 14px;
            color: #030712;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(0, 255, 204, 0.35);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .quantum-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(0, 255, 204, 0.5);
        }

        .quantum-btn:active {
            transform: scale(0.98);
        }

        .footer-hud {
            text-align: center;
            margin-top: 25px;
            font-size: 11px;
            color: rgba(148, 163, 184, 0.5);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="aurora-bg"></div>
    <div class="particle-field"></div>

    <div class="quantum-portal">
        <div class="header-title">Spatial Access</div>
        <div class="header-subtitle">Zero-Trust Neural Identification Portal</div>

        <form>
            <div class="input-container">
                <input type="text" placeholder="Identity / User Handle" required>
            </div>

            <div class="input-container">
                <input type="password" placeholder="Cryptographic Passkey" required>
            </div>

            <div class="security-badge">
                <label>
                    <input type="checkbox"> Secure Session
                </label>
                <span style="color: var(--quantum-primary);">● Encrypted</span>
            </div>

            <button type="submit" class="quantum-btn">Authorize Entry</button>
        </form>

        <div class="footer-hud">
            WebGPU Accelerated • Spatial UI v4.0
        </div>
    </div>

</body>
</html>
