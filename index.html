<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Glassmorphism Login</title>
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #4caf50 0%, #8bc34a 100%);
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-color: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(-45deg, #1b5e20, #2e7d32, #388e3c, #4caf50);
            background-size: 400% 400%;
            animation: auroraBackground 15s ease infinite;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        @keyframes auroraBackground {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .login-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            padding: 40px 30px;
            border-radius: 24px;
            width: 350px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), inset 0 0 15px rgba(255, 255, 255, 0.1);
            color: var(--text-color);
            text-align: left;
            transform: translateY(20px);
            opacity: 0;
            animation: smoothEntrance 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            position: relative;
        }

        @keyframes smoothEntrance {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .login-card h2 {
            margin: 0 0 8px 0;
            font-size: 28px;
            font-weight: 600;
            background: linear-gradient(to right, #fff, #c8e6c9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .login-card p {
            margin: 0 0 30px 0;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.7);
        }

        .input-group {
            position: relative;
            margin-bottom: 25px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            color: #fff;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.5);
            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: #8bc34a;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 15px rgba(139, 195, 74, 0.4);
        }

        .remember-me {
            display: flex;
            align-items: center;
            font-size: 13px;
            margin-bottom: 25px;
            color: rgba(255, 255, 255, 0.8);
            cursor: pointer;
        }

        .remember-me input {
            margin-right: 10px;
            accent-color: #4CAF50;
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: var(--primary-gradient);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(76, 175, 80, 0.4);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(76, 175, 80, 0.6);
        }

        .login-btn:active {
            transform: scale(0.97);
        }

        .signup-text {
            text-align: center;
            margin-top: 25px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
        }

        .signup-text a {
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.3s;
        }

        .signup-text a:hover {
            color: #8bc34a;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Login</h2>
        <p>Welcome back please login to your account</p>
        
        <form>
            <div class="input-group">
                <input type="text" placeholder="User Name" required>
            </div>
            
            <div class="input-group">
                <input type="password" placeholder="Password" required>
            </div>
            
            <label class="remember-me">
                <input type="checkbox" id="remember"> Remember me
            </label>
            
            <button type="submit" class="login-btn">Login</button>
        </form>

        <div class="signup-text">
            Don't have an account? <a href="#">Signup</a>
        </div>
    </div>

</body>
</html>
